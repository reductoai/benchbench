# Parsing-benchmark catalog. Facts carry a `source`; fields marked `verify: true` are not yet checked
# against the benchmark's own repo.
# `datalab_2026` = score and judge agreement from datalab.to/blog/which-parsing-benchmarks-to-trust
# (Nov 2026; 7 open models, 3 LLM judges, 200 pages per benchmark). `hf_revision` = commit pinned 2026-11-07.
# `seller` = the builder sells a parser or model the benchmark ranks (a conflict to report, not proof of bias).

benchmarks:
  - id: parsebench2
    home_preset: llamaparse_agentic_plus
    name: ParseBench-2 (new cases only)
    builder: LlamaIndex
    seller: LlamaParse
    tier: 1
    data: public
    hf_repo: llamaindex/ParseBench-2
    hf_revision: 880b2204948071f464cc0b06bfb1b8f1021b1c7c
    license: apache-2.0
    scorer_repo: https://github.com/run-llama/ParseBench
    pages: 2324
    page_files: {glob: "*/*.{pdf,jpg,png}", only_list: parsebench2_new.txt, strata: "^([^/]+)/"}
    page_files_note: "4,317 cases at the pinned revision; new-case population pinned in parsebench2_new.txt"
    tracks: [text, formatting, tables, charts, layout, forms]
    native_metric: ParseBench-2 next scorers (table_next, formatting_v2, forms_v2, layout grounding); severity-capped page score

  - id: omniparsebench
    home_preset: datalab_accurate
    name: OmniParseBench
    builder: Datalab
    seller: Chandra / Marker
    tier: 1
    data: public
    hf_repo: datalab-to/omni_parse_bench
    hf_revision: d70182b9f901
    license: other (per-source licenses in licenses/)
    scorer_repo: https://github.com/datalab-to/omni_parse_bench
    pages: 2937
    page_files: {glob: "pages/*.{pdf,png}", strata: "^pages/([a-z_]+)-"}
    ground_truth: 16,288 pass/fail tests from 22 suites in 92 languages (gold/*.json)
    native_metric: test pass rate
    known_conventions: ["Builder authored the 2026 meta-review that ranks its own benchmark first (87.2)"]
    datalab_2026: {score: 87.2, rank: 1, judge_agreement: 1.00, ci90: [0.86, 1.00]}

  - id: omnidocbench
    name: OmniDocBench (v1.6 on HF main; v1.0 and v1.5 by tag)
    builder: Shanghai AI Laboratory / OpenDataLab
    seller: MinerU (open source)
    tier: 1
    data: public
    hf_repo: opendatalab/OmniDocBench
    hf_revision: aa1ee96d106d
    license: unstated on HF card (verify)
    scorer_repo: https://github.com/opendatalab/OmniDocBench
    pages: 1651
    page_files: {glob: "images/*.{jpg,png}", strata: "^images/([A-Za-z]+)_"}
    ground_truth: OmniDocBench.json, block-level layout + text + LaTeX formula + HTML table
    native_metric: text edit distance, table TEDS, formula CDM, reading-order edit distance
    known_conventions:
      - "v1.6 adds 296 Hard pages chosen where MinerU2.5, PaddleOCR-VL and Qwen3-VL disagree (datalab_2026)"
      - "Formulas must be written with $ delimiters (datalab_2026)"
    datalab_2026:
      v1_0: {score: 74.3, rank: 6, judge_agreement: 0.86, ci90: [0.71, 0.90]}
      v1_5: {score: 77.0, rank: 4, judge_agreement: 0.86, ci90: [0.81, 0.90]}
      v1_6: {score: 76.7, rank: 5, judge_agreement: 0.81, ci90: [0.76, 0.90]}

  - id: real5_omnidocbench
    name: Real5-OmniDocBench
    builder: Baidu PaddlePaddle + HKUST (Guangzhou)
    seller: PaddleOCR-VL (open source)
    tier: 1
    data: public
    hf_repo: PaddlePaddle/Real5-OmniDocBench
    hf_revision: f0585fb44c2a
    license: apache-2.0
    scorer_repo: https://github.com/opendatalab/OmniDocBench (same scorer as OmniDocBench v1.5)
    pages: 6775
    page_files: {glob: "Real5-OmniDocBench-*/*.{jpg,png}", strata: "^Real5-OmniDocBench-([^/]+)/"}
    pair_with: {benchmark: omnidocbench, folder: "^Real5-OmniDocBench-([^/]+)/", captures_per_page: 5}
    pair_note: "1,355 of 1,355 capture stems match images/<stem> in opendatalab/OmniDocBench (checked 2026-11-07).
      clean = the OmniDocBench original; conditions real_illumination, real_scanning, real_screen_photography,
      real_skew, real_warping. Strata are OmniDocBench's."
    ground_truth: OmniDocBench v1.5 annotations; 1,355 pages re-captured in 5 physical conditions
    native_metric: OmniDocBench v1.5 metrics per condition
    notes: "Already a physical-robustness benchmark: run stage 3 as a cross-check that synthetic perturbations
      move scores the way real captures do (its scanning/skew vs our scan/tilt conditions)."
    datalab_2026: {score: 79.2, rank: 2, judge_agreement: 0.95, ci90: [0.86, 1.00]}

  - id: puredocbench
    name: PureDocBench
    builder: UCAS / CASIA and others
    seller: none known (OpenOCR authors)
    tier: 2
    data: public (page images in separately downloaded parts, see README_FULL_DATASET_PARTS.txt)
    hf_repo: zhihengli-casia/puredocbench
    hf_revision: 4665b40a3333f7643bad7c8675a9062b482511ad
    license: cc-by-4.0
    scorer_repo: https://github.com/zhihengli-casia/PureDocBench
    pages: 1475
    # Pages ship only in pdb_full.tar.part-000..009 (37.6 GB). Reconstruct with
    #   for i in 000 ... 009: curl <hf resolve url>/pdb_full.tar.part-$i | tee >(sha256sum) | tar -x
    # check the stream against pdb_full.tar.sha256 (598815f9...b524), then set PUREDOCBENCH_ROOT to the
    # directory that holds puredocbench-v1.0/. GT is the 2026-10-07 GT in the archive at this revision
    # (gt/latest.json sha 4340c712...); the adapter checks gt/ against that archive.
    page_files:
      local_env: PUREDOCBENCH_ROOT
      glob: "puredocbench-v1.0/images/clean/*/*/*.png"
      strata: "images/clean/([0-9]{2}_[a-z_]+)/"
      archive_sha256: 598815f9b93c63858dc7a435cd8c5cd52921196541070d4011f05164a931b524
    tracks: [clean, degraded, real_capture]
    ground_truth: LLM-written HTML pages rendered by a browser, so GT is exact by construction
    native_metric: OmniDocBench-style metrics per track
    datalab_2026: {score: 78.4, rank: 3, judge_agreement: 0.90, ci90: [0.81, 0.90]}

  - id: mdpbench
    name: MDPBench
    builder: Huazhong University of Science and Technology + Kingsoft Office
    seller: none known
    tier: 2
    data: partly public (2,720 public images; 680 private)
    hf_repo: Delores-Lin/MDPBench
    hf_revision: 252df132fe1b
    license: apache-2.0
    scorer_repo: https://github.com/Yuliang-Liu/MultimodalOCR
    pages: 2720
    page_files: {glob: "MDPBench_img_public/*", strata: "^MDPBench_img_public/([a-z]{2})_"}
    ground_truth: 850 documents in 17 languages, each digital + 3 photographs; OmniDocBench-style GT
    native_metric: OmniDocBench-style edit distance / TEDS
    datalab_2026: {score: 68.4, rank: 7, judge_agreement: 0.90, ci90: [0.71, 0.90]}

  - id: ocrflux_bench
    name: OCRFlux-bench (single-page; cross-page set separate)
    builder: ChatDOC
    seller: OCRFlux-3B
    tier: 2
    data: public
    hf_repo: ChatDOC/OCRFlux-bench-single
    hf_revision: 2ef2080038c7
    license: apache-2.0
    scorer_repo: https://github.com/chatdoc-com/OCRFlux
    pages: 2000
    page_files:
      archive: pdfs.tar.gz
      glob: "**/*.pdf"
      strata_map: {file: data.jsonl, key: pdf_name, field: language}
    ground_truth: manually labelled markdown per page (data.jsonl)
    native_metric: edit distance on raw markdown
    known_conventions: ["Format changes move the score more than real reading errors (datalab_2026)"]
    datalab_2026: {score: 67.4, rank: 8, judge_agreement: 0.67, ci90: [0.57, 0.81]}

  - id: dp_bench
    name: DP-Bench
    builder: Upstage
    seller: Upstage Document Parse
    tier: 1
    data: public
    hf_repo: upstage/dp-bench
    hf_revision: 24702c61a2fb
    license: mit
    scorer_repo: https://huggingface.co/datasets/upstage/dp-bench (src/ and scripts/ in the dataset repo)
    pages: 200
    page_files: {glob: "dataset/pdfs/*.pdf"}
    ground_truth: dataset/reference.json (element-level, HTML tables)
    native_metric: NID (reading-order text edit distance) + TEDS / TEDS-S for tables
    known_conventions: ["Pretty-printed HTML tables lose 38 points (datalab_2026)"]
    datalab_2026: {score: 65.0, rank: 9, judge_agreement: 0.81, ci90: [0.62, 0.90]}

  - id: score_bench
    name: SCORE-Bench
    builder: Unstructured
    seller: Unstructured
    tier: 2
    data: public
    hf_repo: unstructuredio/SCORE-Bench
    hf_revision: 15dc068f6f9adcfbfd84dbddfdf2a2c9c11bf0c0
    license: "annotations CC BY 4.0; PDFs keep third-party licenses listed per file in the HF README (some CC BY-NC-SA / CC BY-NC-ND: redistribution of those page images is restricted)"
    scorer_repo: https://github.com/Unstructured-IO/unstructured-eval-metrics
    scorer_commit: b148439dd428bb10d7f2bb80c7386ea08cbd7447
    pages: 224
    page_files: {glob: "src/*.pdf"}
    page_files_note: "224 single-page PDFs in src/ at the pinned revision (checked 2026-11-07); ground truth content-gt/<file>__uns-plaintext-v1.0.0__0x0001__0.txt and table-gt/<file>__uns-table-json-v1.0.0__0x0002__0.json. No category field in the release, so one stratum. Full set is run (224 <= 500). The HF card says it is not the exact dataset in the SCORE paper."
    ground_truth: business documents with scans, handwriting and forms; expert-annotated element-marked plain text plus table cell JSON
    native_metric: CCT text-fidelity score (unstructured-eval-metrics); adjusted CCT, tokens found/added and table metrics as subscores
    datalab_2026: {score: 59.4, rank: 10, judge_agreement: 0.62, ci90: [0.52, 0.81]}

  - id: olmocr_bench
    name: olmOCR-bench
    builder: Allen Institute for AI
    seller: olmOCR (open weights)
    tier: 1
    data: public
    hf_repo: allenai/olmOCR-bench
    hf_revision: 54a96a6fb6a2
    license: odc-by
    scorer_repo: https://github.com/allenai/olmocr (olmocr/bench)
    pages: 1403
    page_files: {glob: "bench_data/pdfs/**/*.pdf", strata: "^bench_data/pdfs/([^/]+)/"}
    ground_truth: 7,010 pass/fail unit tests (bench_data/*.jsonl)
    native_metric: test pass rate per suite, averaged
    known_conventions: ["Page headers must be left out of the output (datalab_2026)"]
    datalab_2026: {score: 56.4, rank: 11, judge_agreement: 0.57, ci90: [0.48, 0.71]}

  - id: idp_leaderboard
    name: IDP Leaderboard (IDP Core)
    builder: Nanonets
    seller: Nanonets OCR
    tier: 2
    # IDP Core = KIE, OCR, VQA, TABLE. Only TABLE is page parsing: OCR images are single text-line crops and
    # KIE/VQA are question answering. TABLE = 6 synthetic table sets x 50 test rows = 300 images (verified
    # 2026-11-07), so the full set is run. Same images as nanonets/idp-leaderboard-results images/idp/nanonets_*.
    data: public (6 nanonets/*_table datasets, test.parquet, 50 rows each)
    hf_repo: null
    hf_revision: null
    license: MIT (dataset cards)
    scorer_repo: https://github.com/NanoNets/docext
    scorer_commit: 8a08bbd58fd25216331a2134e48374d1a6ed79bb
    harness_repo: https://github.com/NanoNets/idp-leaderboard-benchmarks
    harness_commit: 2fba329699060034a97428f28f3342a42ad23548
    pages: 300
    page_files:
      parquet:
        - {name: small_sparse_structured_table, hf_repo: nanonets/small_sparse_structured_table, hf_revision: 46c056dc68390766a4efc8b7eeae899d6bcc7507, file: test.parquet}
        - {name: small_dense_structured_table, hf_repo: nanonets/small_dense_structured_table, hf_revision: 46031841371fc198e3e75167cfc5af21c7d4f3ad, file: test.parquet}
        - {name: small_sparse_unstructured_table, hf_repo: nanonets/small_sparse_unstructured_table, hf_revision: 96c6379405a394b6a139ac2ce8b50e0ead482c2f, file: test.parquet}
        - {name: long_dense_structured_table, hf_repo: nanonets/long_dense_structured_table, hf_revision: 9e82806366dd3b4212880e36bcfc5cf387d5b651, file: test.parquet}
        - {name: long_sparse_structured_table, hf_repo: nanonets/long_sparse_structured_table, hf_revision: 8ad724cc6afa2a68e9483417ec63aea22a42244a, file: test.parquet}
        - {name: long_sparse_unstructured_table, hf_repo: nanonets/long_sparse_unstructured_table, hf_revision: c8517bf732619e8f8956a47e445a0b9f276dc3b3, file: test.parquet}
      image_column: images
      glob: "*/*.jpg"
      strata: "^([^/]+)/"
    native_metric: mean of olmOCR-bench, OmniDocBench v1.5 and IDP Core; run the IDP Core table part
    known_conventions: ["A code fence around the output drops the score from 100 to 33.5 (datalab_2026)"]
    datalab_2026: {score: 50.4, rank: 13, judge_agreement: 0.67, ci90: [0.43, 0.76]}

  - id: rd_tablebench
    home_preset: reducto_r1
    name: RD-TableBench
    builder: Reducto
    seller: Reducto
    tier: 1
    data: public
    hf_repo: reducto/rd-tablebench
    hf_revision: 7748503e2bd5f210d27aa2ef5fdf4b8aa13099bb
    license: cc-by-nc-nd-4.0
    scorer_repo: https://github.com/reductoai/rd-tablebench
    scorer_commit: 1cae108e6395ddc8389af17385f9769519070558
    pages: 1000
    page_files:
      archive: "*.zip"
      glob: "rd-tablebench/_images/*.jpg"
      strata_csv: {file: "rd-tablebench/providers/scores.csv", key: pdf_path, value: language}
    page_files_note: "Verified 2026-11-07 at the pinned revision: rd-tablebench.zip holds 1,000 pdfs/, 1,000
      _images/*.jpg and 1,000 groundtruth/*.html with identical stems, plus 7 vendors' 2024 outputs and
      providers/scores.csv (1,000 rows, language column). Every PDF is one page, has no text layer and wraps
      the same image, so the JPG is the page source (no re-rendering). Each ground truth file is one table.
      Strata: 14 languages from scores.csv (en 461, ru 84, de 83, es 64, fr 58, ja 47, zh 39, it 34, pt 29,
      uk 28, nl 22, cs 21, pl 17, sv 12, ro 1)."
    ground_truth: hand-labelled HTML tables, one per page (groundtruth/<stem>.html)
    native_metric: "table similarity 0-1 (grading.table_similarity: Needleman-Wunsch over rows, Levenshtein
      partial credit over cells) of the largest HTML table in the output vs ground truth"
    notes: "Our own benchmark. It must be run and reported with the same rules as every other vendor's,
      and its results must be shown even if they are unflattering. CC BY-NC-ND: redistribution of page images is restricted."

  - id: logicsdocbench
    name: LogicsDocBench
    builder: Alibaba Logics team
    tier: 3
    data: private (900 pages)
    notes: "Cannot run stages 1-3. Report only the published claims; 43% of its headline is notations only some
      parsers write: SMILES, Mermaid, ABC music (datalab_2026)."

  - id: xdocparse
    name: XDocParse
    builder: Xiaohongshu hi lab
    tier: 3
    data: private (126 languages)
    notes: Cannot run. Report only published claims.

out_of_scope:
  - "OCRBench v2, CC-OCR: VLM text-recognition QA, not page-to-markdown parsing"
  - "PubTabNet, FinTabNet: table-structure training sets with known label noise; RD-TableBench covers tables"
  - "Vendor marketing numbers without public data (e.g. private Mistral or Extend benchmarks)"
