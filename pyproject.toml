[project]
name = "benchbench"
version = "0.1.0"
description = "Audit document-parsing benchmarks: native scorer vs blind judge vs perturbed pages"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "huggingface_hub>=0.24",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.3",
  "pypdfium2>=4.30",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
idp = ["pyarrow>=20"]
ocrflux = ["nltk==3.9.1"]
# DP-Bench scorer requirements (pinned as in upstage/dp-bench requirements.txt)
dp_bench = ["rapidfuzz==3.6.1", "distance==0.1.3", "apted==1.0.3", "lxml==5.1.0", "scipy", "shapely"]

[project.scripts]
benchbench = "benchbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchbench", "benchbench.adapters"]

[tool.setuptools.package-data]
benchbench = ["*.yaml", "*.txt"]
"benchbench.adapters" = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
